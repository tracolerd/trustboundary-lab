<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">TrustBoundary Lab — LLM application security evaluation</title>
  <desc id="desc">A dark, technical banner illustrating trust boundaries around prompts, tools, retrieved content, and evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="30" x2="1510" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset=".52" stop-color="#17162F"/>
      <stop offset="1" stop-color="#101D2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A78BFA"/>
      <stop offset=".55" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="panel" x1="1030" y1="95" x2="1495" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#202344"/>
      <stop offset="1" stop-color="#101C2C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1245 220) rotate(90) scale(270 330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED" stop-opacity=".28"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#A5B4FC" fill-opacity=".22"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="1600" height="500" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="500" rx="28" fill="url(#dots)" opacity=".65"/>
  <rect width="1600" height="500" rx="28" fill="url(#glow)"/>
  <path d="M0 410C244 335 366 492 625 420C842 360 903 325 1088 374C1291 428 1440 378 1600 318V500H0V410Z" fill="#080D1A" fill-opacity=".52"/>
  <path d="M72 78H98" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <text x="112" y="84" fill="#A5B4FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="4.5">SECURITY ENGINEERING LAB  /  004</text>
  <text x="88" y="176" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="61" font-weight="750" letter-spacing="-2.2">TrustBoundary Lab</text>
  <text x="92" y="225" fill="#C7D2FE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="500">Evaluate the boundary. Inspect the evidence.</text>
  <text x="92" y="276" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Repeatable adversarial scenarios for LLM-powered applications.</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.3">
    <rect x="92" y="323" width="205" height="37" rx="18.5" fill="#7C3AED" fill-opacity=".18" stroke="#A78BFA" stroke-opacity=".65"/>
    <circle cx="111" cy="341.5" r="4" fill="#C4B5FD"/>
    <text x="124" y="346" fill="#DDD6FE">PROMPT INJECTION</text>
    <rect x="309" y="323" width="219" height="37" rx="18.5" fill="#0891B2" fill-opacity=".15" stroke="#67E8F9" stroke-opacity=".6"/>
    <circle cx="328" cy="341.5" r="4" fill="#67E8F9"/>
    <text x="341" y="346" fill="#CFFAFE">TOOL AUTHORIZATION</text>
    <rect x="540" y="323" width="184" height="37" rx="18.5" fill="#059669" fill-opacity=".14" stroke="#6EE7B7" stroke-opacity=".6"/>
    <circle cx="559" cy="341.5" r="4" fill="#6EE7B7"/>
    <text x="572" y="346" fill="#D1FAE5">DATA LEAKAGE</text>
  </g>
  <text x="92" y="428" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" letter-spacing="2.5">CONTROLLED INPUTS  →  APPLICATION CHECKS  →  AUDITABLE RESULTS</text>
  <g filter="url(#shadow)">
    <rect x="876" y="83" width="643" height="340" rx="24" fill="url(#panel)" stroke="#64748B" stroke-opacity=".45"/>
    <rect x="896" y="103" width="603" height="300" rx="17" stroke="#94A3B8" stroke-opacity=".18"/>
    <path d="M918 133H971" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    <circle cx="919" cy="133" r="4" fill="#F87171"/>
    <circle cx="935" cy="133" r="4" fill="#FBBF24"/>
    <circle cx="951" cy="133" r="4" fill="#34D399"/>
    <text x="983" y="138" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">EVALUATION PIPELINE</text>
    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <rect x="923" y="171" width="145" height="64" rx="12" fill="#17233B" stroke="#8B5CF6" stroke-opacity=".85"/>
      <text x="995.5" y="196" text-anchor="middle" fill="#C4B5FD" font-size="11" font-weight="700" letter-spacing="1.2">01 / INPUT</text>
      <text x="995.5" y="217" text-anchor="middle" fill="#F8FAFC" font-size="15" font-weight="600">Scenario</text>
      <path d="M1068 203H1115" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M1108 196L1116 203L1108 210" stroke="#67E8F9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="1121" y="171" width="151" height="64" rx="12" fill="#172B3D" stroke="#22D3EE" stroke-opacity=".85"/>
      <text x="1196.5" y="196" text-anchor="middle" fill="#A5F3FC" font-size="11" font-weight="700" letter-spacing="1.2">02 / ENFORCE</text>
      <text x="1196.5" y="217" text-anchor="middle" fill="#F8FAFC" font-size="15" font-weight="600">Trust boundary</text>
      <path d="M1272 203H1318" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M1311 196L1319 203L1311 210" stroke="#6EE7B7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="1325" y="171" width="149" height="64" rx="12" fill="#17352F" stroke="#34D399" stroke-opacity=".85"/>
      <text x="1399.5" y="196" text-anchor="middle" fill="#A7F3D0" font-size="11" font-weight="700" letter-spacing="1.2">03 / RECORD</text>
      <text x="1399.5" y="217" text-anchor="middle" fill="#F8FAFC" font-size="15" font-weight="600">Evidence</text>
    </g>
    <path d="M995 235V260H1197V235M1197 235V260H1399V235" stroke="#64748B" stroke-opacity=".6" stroke-width="1.5" stroke-dasharray="5 6"/>
    <rect x="924" y="280" width="550" height="87" rx="13" fill="#0B1220" stroke="#64748B" stroke-opacity=".35"/>
    <circle cx="953" cy="307" r="7" fill="#34D399" fill-opacity=".2" stroke="#6EE7B7"/>
    <path d="M949 307L952 310L958 303" stroke="#6EE7B7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="974" y="311" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">Deterministic assertions</text>
    <text x="974" y="334" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Rule-backed checks, reproducible fixtures, inspectable output</text>
    <path d="M1386 298H1448M1386 313H1432M1386 328H1442" stroke="#64748B" stroke-width="3" stroke-linecap="round" opacity=".7"/>
    <text x="925" y="390" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">MOCK-FIRST  •  COST-FREE BASELINE  •  LOCAL EVIDENCE</text>
  </g>
  <rect x=".75" y=".75" width="1598.5" height="498.5" rx="27.25" stroke="#94A3B8" stroke-opacity=".16" stroke-width="1.5"/>
</svg>